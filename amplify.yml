version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Variáveis do console do Amplify só existem no ambiente de build; route
        # handlers do Next não as veem em tempo de requisição. Gravá-las em
        # .env.production é o caminho documentado pela AWS para expor ao runtime SSR.
        # Ref: docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        # `|| true`: grep sai com 1 quando não casa nada, o que abortaria o build.
        # A chave continua vindo do console; região/modelo ficam versionados.
        # Isso evita que uma BEDROCK_CHAT_MODEL antiga no console sobreponha o
        # GLM 5 configurado neste deploy.
        - env | grep -e '^BEDROCK_API_KEY=' -e '^BEDROCK_BASE_URL=' >> .env.production || true
        - printf 'BEDROCK_REGION=sa-east-1\nBEDROCK_CHAT_MODEL=zai.glm-5\n' >> .env.production
        # DynamoDB usa credenciais temporárias da SSR Compute role; não há access key.
        - printf 'DYNAMODB_REGION=sa-east-1\nDYNAMODB_TABLE_PREFIX=baxijen-prod\nCHAT_RETENTION_DAYS=180\n' >> .env.production
        # Tópico do aviso de novo contato. Sai do output LeadNotificationTopicArn
        # da stack baxijen-prod-data; não é segredo e por isso fica versionado.
        - printf 'LEAD_NOTIFICATION_TOPIC_ARN=arn:aws:sns:sa-east-1:381492202560:baxijen-prod-new-leads\n' >> .env.production
        # Segredo do painel, definido no console do Amplify. Sem ele no
        # .env.production o proxy falha fechado e o painel responde 503 —
        # variável de console sozinha não chega ao runtime SSR.
        # ADMIN_FROM_EMAIL e ADMIN_SESSION_DAYS são opcionais: sem eles o
        # código usa contato@baxi.ia.br e sessão de 7 dias.
        - env | grep -e '^ADMIN_AUTH_SECRET=' -e '^ADMIN_FROM_EMAIL=' -e '^ADMIN_SESSION_DAYS=' >> .env.production || true
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        # Testes antes do build: uma regressão em validação de formulário ou
        # no upsert de lead reprova o deploy em vez de chegar em produção.
        - npm run test:run
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
