<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="50%" stop-color="#111B3A"/>
      <stop offset="100%" stop-color="#0A0E27"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0099DD"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00CC82"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#5A3FDD"/>
    </linearGradient>
    <linearGradient id="barGradOther" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A4A7A"/>
      <stop offset="100%" stop-color="#2A3A6A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Title section -->
  <text x="60" y="55" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0.5">
    Procurement de IA em 2026
  </text>
  <text x="60" y="85" fill="#00C2FF" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500">
    Top 10 critérios de compra enterprise | Score ponderado (0-10)
  </text>

  <!-- Chart area: horizontal bar chart -->
  <!-- Y-axis labels and bars -->

  <!-- Bar 1: Data Security 9.2 -->
  <text x="290" y="140" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Security &amp; Compliance</text>
  <rect x="300" y="125" width="552" height="28" rx="4" fill="url(#barGrad1)" filter="url(#glow)" opacity="0.95"/>
  <text x="860" y="144" fill="#00C2FF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">9.2</text>

  <!-- Bar 2: Integration Depth 8.7 -->
  <text x="290" y="185" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Integration Depth</text>
  <rect x="300" y="170" width="522" height="28" rx="4" fill="url(#barGrad1)" opacity="0.90"/>
  <text x="830" y="189" fill="#00C2FF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">8.7</text>

  <!-- Bar 3: Observability 8.4 (highlighted - biggest mover) -->
  <text x="290" y="230" fill="#00FFA3" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">Observability ↑</text>
  <rect x="300" y="215" width="504" height="28" rx="4" fill="url(#barGrad2)" filter="url(#glow)" opacity="0.95"/>
  <text x="812" y="234" fill="#00FFA3" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">8.4</text>
  <text x="300" y="255" fill="#00FFA3" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.8">↑ 1.8 vs 2025 (maior salto)</text>

  <!-- Bar 4: Vendor Stability 8.1 -->
  <text x="290" y="280" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Vendor Stability</text>
  <rect x="300" y="265" width="486" height="28" rx="4" fill="url(#barGrad3)" opacity="0.85"/>
  <text x="794" y="284" fill="#7B61FF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">8.1</text>

  <!-- Bar 5: Capability Benchmarks 7.9 -->
  <text x="290" y="325" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Capability Benchmarks</text>
  <rect x="300" y="310" width="474" height="28" rx="4" fill="url(#barGradOther)" opacity="0.80"/>
  <text x="782" y="329" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">7.9</text>

  <!-- Bar 6: TCO 3yr 7.6 -->
  <text x="290" y="370" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">TCO (3 anos)</text>
  <rect x="300" y="355" width="456" height="28" rx="4" fill="url(#barGradOther)" opacity="0.75"/>
  <text x="764" y="374" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">7.6</text>

  <!-- Bar 7: Time to Production 7.3 -->
  <text x="290" y="415" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Time to Production</text>
  <rect x="300" y="400" width="438" height="28" rx="4" fill="url(#barGradOther)" opacity="0.70"/>
  <text x="746" y="419" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">7.3</text>

  <!-- Bar 8: Customisation 6.9 -->
  <text x="290" y="460" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Customisation</text>
  <rect x="300" y="445" width="414" height="28" rx="4" fill="url(#barGradOther)" opacity="0.65"/>
  <text x="722" y="464" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">6.9</text>

  <!-- Bar 9: Support Quality 6.8 -->
  <text x="290" y="505" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Support Quality</text>
  <rect x="300" y="490" width="408" height="28" rx="4" fill="url(#barGradOther)" opacity="0.60"/>
  <text x="716" y="509" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">6.8</text>

  <!-- Bar 10: Brand Alignment 6.4 -->
  <text x="290" y="550" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end">Brand Alignment</text>
  <rect x="300" y="535" width="384" height="28" rx="4" fill="url(#barGradOther)" opacity="0.55"/>
  <text x="692" y="554" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">6.4</text>

  <!-- Right side: disqualification stats -->
  <g transform="translate(900, 130)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">Motivos de eliminação</text>
    <text x="0" y="0" fill="#00C2FF" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" opacity="0.9">antes da demo</text>

    <text x="0" y="40" fill="#FF6B6B" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800">32%</text>
    <text x="0" y="58" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.8">Security / compliance</text>

    <text x="0" y="88" fill="#FFB347" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800">22%</text>
    <text x="0" y="106" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.8">Observability</text>

    <text x="0" y="136" fill="#7B61FF" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800">18%</text>
    <text x="0" y="154" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.8">Integration gap</text>

    <text x="0" y="184" fill="#8A9ABF" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800">12%</text>
    <text x="0" y="202" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.8">TCO over budget</text>

    <text x="0" y="232" fill="#5A6A8A" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800">9%</text>
    <text x="0" y="250" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.8">Capability gap (POC)</text>
  </g>

  <!-- Divider -->
  <line x1="880" y1="120" x2="880" y2="570" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Bottom branding -->
  <rect x="0" y="610" width="1200" height="2" fill="url(#accentGrad)" opacity="0.5"/>
  <text x="60" y="600" fill="#00C2FF" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">
    BaXiJen · IA Brasileira
  </text>
  <text x="1140" y="600" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" opacity="0.5" text-anchor="end">
    Fonte: Presenc AI 2026 · AgentMode AI · BCG · Gartner
  </text>

  <!-- Scale indicator -->
  <text x="300" y="580" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="10" opacity="0.4">0</text>
  <text x="870" y="580" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="10" opacity="0.4" text-anchor="end">10</text>
  <line x1="300" y1="572" x2="852" y2="572" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
</svg>