<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00d4ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#cyanBar)"/>

  <!-- Title -->
  <text x="60" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">
    Licitações de IA Depois do Muse
  </text>
  <text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#00d4ff" text-anchor="start">
    O que a troca Llama → Muse da Meta muda no edital público brasileiro
  </text>

  <!-- LEFT: timeline Llama -> Muse -->
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Da marca que parou à marca que chegou
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="60" y="166" width="350" height="78" rx="10" fill="#16324f" stroke="#f39c12" stroke-width="1.5"/>
    <text x="80" y="192" font-size="14" font-weight="700" fill="#f39c12">Llama 4 · abr 2025</text>
    <text x="80" y="211" font-size="12" fill="#ffffff">Última geração com o nome. Community License</text>
    <text x="80" y="228" font-size="11" fill="#8899aa">trava de 700 mi MAU · Built with Llama · AUP</text>

    <rect x="60" y="254" width="350" height="78" rx="10" fill="#16324f" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="80" y="280" font-size="14" font-weight="700" fill="#2ecc71">Muse Glimmer 30B · ago 2026</text>
    <text x="80" y="299" font-size="12" fill="#ffffff">Nova conta, nova marca. Apache 2.0 de verdade</text>
    <text x="80" y="316" font-size="11" fill="#8899aa">sem trava de usuário, sem branding, sem AUP</text>

    <rect x="60" y="342" width="350" height="78" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="80" y="368" font-size="14" font-weight="700" fill="#00d4ff">Muse Spark Open · 15 out 2026</text>
    <text x="80" y="387" font-size="12" fill="#ffffff">816 bi de parâmetros, 42 bi ativos por token</text>
    <text x="80" y="404" font-size="11" fill="#8899aa">mais capaz dos EUA · licença customizada</text>
  </g>

  <line x1="235" y1="244" x2="235" y2="252" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="235" y1="332" x2="235" y2="340" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- KPI box under timeline -->
  <rect x="60" y="438" width="350" height="86" rx="10" fill="#0f2540" stroke="#00d4ff" stroke-width="1"/>
  <text x="80" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">O rótulo trocou de significado em 60 dias</text>
  <text x="80" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#88d8f7">agosto: aberto = Apache 2.0 · outubro: aberto = com</text>
  <text x="80" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#88d8f7">branding obrigatório, AUP e gatilho de receita</text>

  <!-- CENTER: 4 clauses of Muse Model License -->
  <text x="446" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    As 4 cláusulas da Muse Model License
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="446" y="166" width="350" height="80" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="466" y="192" font-size="14" font-weight="700" fill="#00d4ff">1 · Atribuição obrigatória</text>
    <text x="466" y="211" font-size="12" fill="#ffffff">"Built with Muse" visível no produto público</text>
    <text x="466" y="228" font-size="11" fill="#8899aa">identidade do órgão × branding privado estrangeiro</text>

    <rect x="446" y="256" width="350" height="80" rx="10" fill="#16324f" stroke="#f39c12" stroke-width="1.5"/>
    <text x="466" y="282" font-size="14" font-weight="700" fill="#f39c12">2 · Gatilho de US$ 20 mi / 12 meses</text>
    <text x="466" y="301" font-size="12" fill="#ffffff">receita agregada do grupo: ~R$ 109 milhões</text>
    <text x="466" y="318" font-size="11" fill="#8899aa">vale para quem revende inferência; "afiliadas" indefinido</text>

    <rect x="446" y="346" width="350" height="80" rx="10" fill="#16324f" stroke="#88d8f7" stroke-width="1.5"/>
    <text x="466" y="372" font-size="14" font-weight="700" fill="#88d8f7">3 · Política de uso aceitável</text>
    <text x="466" y="391" font-size="12" fill="#ffffff">cláusula unilateral, editável, sem versão em PT</text>
    <text x="466" y="408" font-size="11" fill="#8899aa">contrato público pode se vincular a política de terceiro?</text>

    <rect x="446" y="436" width="350" height="88" rx="10" fill="#16324f" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="466" y="462" font-size="14" font-weight="700" fill="#e74c3c">4 · Restrições alcançam saídas</text>
    <text x="466" y="481" font-size="12" fill="#ffffff">e derivados: uso como dado sintético fica ambíguo</text>
    <text x="466" y="499" font-size="11" fill="#8899aa">sobre o que o Estado detém direitos do que pagou</text>
    <text x="466" y="516" font-size="11" fill="#8899aa">para produzir?</text>
  </g>

  <!-- RIGHT: o recorte do edital -->
  <text x="832" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    O recorte do edital público
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="832" y="166" width="308" height="96" rx="10" fill="#0f2540" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="852" y="192" font-size="14" font-weight="700" fill="#2ecc71">A lei já exige o aberto</text>
    <text x="852" y="211" font-size="11" fill="#ffffff">Lei 14.129/2021, art. 3º, XXV: tecnologias,</text>
    <text x="852" y="227" font-size="11" fill="#ffffff">padrões e formatos "abertos e livres"</text>
    <text x="852" y="246" font-size="11" fill="#8899aa">IN SGD/ME 94/2022: ETP deve comparar e calcular TCO</text>

    <rect x="832" y="272" width="308" height="112" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="852" y="298" font-size="14" font-weight="700" fill="#00d4ff">O edital de 2026 compra marca</text>
    <text x="852" y="317" font-size="11" fill="#ffffff">IFSP: "a solução ChatGPT", R$ 3.577,76/24 meses</text>
    <text x="852" y="333" font-size="11" fill="#ffffff">Pancas (ES): 7 licenças ChatGPT Business</text>
    <text x="852" y="349" font-size="11" fill="#ffffff">Rondônia: 11.454 licenças SaaS "com IA"</text>
    <text x="852" y="368" font-size="11" fill="#f39c12">modelo entra como rótulo, não como componente</text>

    <rect x="832" y="394" width="308" height="130" rx="10" fill="#0f2540" stroke="#f39c12" stroke-width="1.5"/>
    <text x="852" y="420" font-size="14" font-weight="700" fill="#f39c12">A régua de decisão do TR</text>
    <text x="852" y="439" font-size="11" fill="#ffffff">• nomeie a licença, não o rótulo</text>
    <text x="852" y="455" font-size="11" fill="#ffffff">• exija continuidade demonstrável</text>
    <text x="852" y="471" font-size="11" fill="#ffffff">• direitos sobre as saídas no contrato</text>
    <text x="852" y="487" font-size="11" fill="#ffffff">• descreva capacidade, não marca</text>
    <text x="852" y="511" font-size="11" fill="#2ecc71">licença que o jurídico aprova em uma leitura</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="570" width="1200" height="60" fill="#0a1628" opacity="0.95"/>
  <rect x="0" y="570" width="1200" height="2" fill="url(#cyanBar)"/>
  <text x="60" y="596" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#00d4ff" text-anchor="start">
    Quem escreve "open source" no edital sem nomear a licença compra risco sem preço.
  </text>
  <text x="60" y="616" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="start">
    baxijen.com.br/blog · Por Luiz Felipe Barbedo, BD e Co-fundador na BaXiJen · 05/11/2026
  </text>
</svg>
