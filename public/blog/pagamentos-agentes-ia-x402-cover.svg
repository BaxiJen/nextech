<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="yellowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2ecc71"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">
    Pagamentos Entre Agentes IA: o trilho x402
  </text>
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#00d4ff" text-anchor="start">
    HTTP 402 + stablecoin: como a máquina passou a pagar a máquina.
  </text>

  <!-- LEFT: fluxo x402 em 4 passos -->
  <text x="60" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    O fluxo x402 em 4 passos
  </text>

  <!-- Step boxes -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="60" y="172" width="330" height="52" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="80" y="195" font-size="13" font-weight="700" fill="#00d4ff">1</text>
    <text x="105" y="195" font-size="13" fill="#ffffff">Agente faz o request HTTP padrão</text>
    <text x="105" y="212" font-size="11" fill="#8899aa">sem header especial, sem conta, sem API key</text>

    <rect x="60" y="234" width="330" height="52" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="80" y="257" font-size="13" font-weight="700" fill="#00d4ff">2</text>
    <text x="105" y="257" font-size="13" fill="#ffffff">Servidor responde 402 + preço</text>
    <text x="105" y="274" font-size="11" fill="#8899aa">token, rede CAIP-2, endereço e validade</text>

    <rect x="60" y="296" width="330" height="52" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="80" y="319" font-size="13" font-weight="700" fill="#00d4ff">3</text>
    <text x="105" y="319" font-size="13" fill="#ffffff">Agente assina a transferência USDC</text>
    <text x="105" y="336" font-size="11" fill="#8899aa">EIP-3009, só assina, não envia transação</text>

    <rect x="60" y="358" width="330" height="52" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="80" y="381" font-size="13" font-weight="700" fill="#00d4ff">4</text>
    <text x="105" y="381" font-size="13" fill="#ffffff">Retry com pagamento anexado = 200</text>
    <text x="105" y="398" font-size="11" fill="#8899aa">facilitador liquida na chain e paga o gás</text>
  </g>

  <!-- Arrows between steps -->
  <line x1="225" y1="224" x2="225" y2="232" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="225" y1="286" x2="225" y2="294" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="225" y1="348" x2="225" y2="356" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- KPI box under flow -->
  <rect x="60" y="428" width="330" height="96" rx="10" fill="#0f2540" stroke="#00d4ff" stroke-width="1"/>
  <text x="80" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">205 mi transações até meados de 2026</text>
  <text x="80" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#88d8f7">69 mil agentes ativos · média US$ 0,30 por chamada</text>
  <text x="80" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f39c12">Volume real ajustado: ~US$ 19 mi (Visa/Artemis)</text>
  <text x="80" y="516" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8899aa">&gt;95% do tráfego é sinal de protocolo e teste</text>

  <!-- CENTER: 4 protocolos -->
  <text x="430" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Quatro famílias disputam a camada
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="430" y="172" width="330" height="86" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="450" y="198" font-size="15" font-weight="700" fill="#00d4ff">x402 · Coinbase</text>
    <text x="450" y="218" font-size="12" fill="#ffffff">stablecoin via HTTP, máquina paga máquina</text>
    <text x="450" y="236" font-size="11" fill="#8899aa">Linux Foundation: Visa, Mastercard, Google, Stripe</text>

    <rect x="430" y="268" width="330" height="86" rx="10" fill="#16324f" stroke="#88d8f7" stroke-width="1.5"/>
    <text x="450" y="294" font-size="15" font-weight="700" fill="#88d8f7">AP2 · Google</text>
    <text x="450" y="314" font-size="12" fill="#ffffff">mandado assinado prova a autorização</text>
    <text x="450" y="332" font-size="11" fill="#8899aa">agnóstico de trilho: cartão, banco, stablecoin</text>

    <rect x="430" y="364" width="330" height="86" rx="10" fill="#16324f" stroke="#f39c12" stroke-width="1.5"/>
    <text x="450" y="390" font-size="15" font-weight="700" fill="#f39c12">ACP · OpenAI + Stripe</text>
    <text x="450" y="410" font-size="12" fill="#ffffff">checkout conversacional em fiat no chat</text>
    <text x="450" y="428" font-size="11" fill="#8899aa">Shared Payment Token, Instant Checkout no ChatGPT</text>

    <rect x="430" y="460" width="330" height="86" rx="10" fill="#16324f" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="450" y="486" font-size="15" font-weight="700" fill="#2ecc71">Agent Pay · Mastercard</text>
    <text x="450" y="506" font-size="12" fill="#ffffff">token de rede + score de transação por agente</text>
    <text x="450" y="524" font-size="11" fill="#8899aa">emissores europeus habilitados no nível de rede</text>
  </g>

  <!-- RIGHT: recorte brasileiro -->
  <text x="800" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    O recorte brasileiro
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Pix -->
    <rect x="800" y="172" width="340" height="86" rx="10" fill="#0f2b1d" stroke="#2ecc71" stroke-width="2"/>
    <text x="820" y="200" font-size="15" font-weight="700" fill="#2ecc71">Pix Automático · desde 16/06/2025</text>
    <text x="820" y="220" font-size="12" fill="#ffffff">recorrência com um consentimento único</text>
    <text x="820" y="238" font-size="11" fill="#8899aa">potencial de R$ 4 tri/ano substituindo o débito em conta</text>

    <!-- Drex -->
    <rect x="800" y="268" width="340" height="86" rx="10" fill="#2b2510" stroke="#f1c40f" stroke-width="2"/>
    <text x="820" y="296" font-size="15" font-weight="700" fill="#f1c40f">Drex · piloto reduzido, sem data</text>
    <text x="820" y="316" font-size="12" fill="#ffffff">registro distribuído desligado em 11/2025</text>
    <text x="820" y="334" font-size="11" fill="#8899aa">tokenização sem blockchain na fase inicial · aposta pós-2027</text>

    <!-- BCB 521 -->
    <rect x="800" y="364" width="340" height="112" rx="10" fill="#2b1a0f" stroke="#e67e22" stroke-width="2"/>
    <text x="820" y="392" font-size="15" font-weight="700" fill="#f39c12">Resolução BCB 521 · desde 02/2026</text>
    <text x="820" y="412" font-size="12" fill="#ffffff">stablecoin referenciada em dólar = câmbio</text>
    <text x="820" y="430" font-size="11" fill="#8899aa">limite US$ 100 mil por contraparte não autorizada</text>
    <text x="820" y="448" font-size="11" fill="#8899aa">retenção de 24h acima de US$ 10 mil prevista p/ out/2026</text>
    <text x="820" y="466" font-size="11" fill="#f39c12">x402 nativo faz câmbio por chamada no Brasil</text>

    <!-- Arquitetura de dois trilhos -->
    <rect x="800" y="488" width="340" height="56" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="2"/>
    <text x="820" y="510" font-size="14" font-weight="700" fill="#ffffff">Arquitetura de dois trilhos</text>
    <text x="820" y="530" font-size="12" fill="#88d8f7">Pix por fora (faturamento em reais)</text>
    <text x="820" y="546" font-size="12" fill="#88d8f7">x402 por dentro (consumo entre agentes)</text>
  </g>

  <!-- Divider arrows center->right concept -->
  <line x1="764" y1="255" x2="796" y2="255" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Footer -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#cyanBar)" opacity="0.12"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <text x="600" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">
    Quem controla o trilho controla o agente.
  </text>
  <text x="1170" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00d4ff" text-anchor="end">
    BaXiJen · blog
  </text>
</svg>