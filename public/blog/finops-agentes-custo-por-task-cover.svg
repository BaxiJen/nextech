<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="orangeDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">
    FinOps de Agentes IA: o Custo Por Task
  </text>
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#00d4ff" text-anchor="start">
    A régua que o CFO pede antes de renovar o contrato.
  </text>

  <!-- LEFT: explosão do custo unitário -->
  <text x="60" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    A interação que mudou de preço
  </text>

  <!-- 2023 chat box -->
  <rect x="60" y="175" width="150" height="92" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="135" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#88d8f7" text-anchor="middle">2023</text>
  <text x="135" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">US$ 0,04</text>
  <text x="135" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8899aa" text-anchor="middle">chat linear</text>

  <!-- 2026 orchestration box -->
  <rect x="290" y="175" width="180" height="92" rx="10" fill="#2a1a08" stroke="#f39c12" stroke-width="2"/>
  <text x="380" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f5b041" text-anchor="middle">2026</text>
  <text x="380" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">US$ 1,20</text>
  <text x="380" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c8a05a" text-anchor="middle">orquestração agentic</text>

  <!-- arrow between -->
  <line x1="215" y1="221" x2="283" y2="221" stroke="#f39c12" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- x30 badge: no vão entre os boxes, acima da seta -->
  <rect x="218" y="182" width="62" height="28" rx="14" fill="url(#orangeBar)"/>
  <text x="249" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0a1628" text-anchor="middle">30x</text>

  <!-- EY source -->
  <text x="60" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8899aa" text-anchor="start">
    EY, Total Cost of Agents, 2026
  </text>

  <!-- 60% refinement stat -->
  <text x="60" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Onde o custo mora na task agentic
  </text>

  <!-- stacked bar: 40% first gen, 60% refinement -->
  <rect x="60" y="355" width="176" height="40" rx="6" fill="url(#cyanBar)" opacity="0.85"/>
  <text x="148" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0a1628" text-anchor="middle">40%</text>
  <rect x="236" y="355" width="264" height="40" rx="6" fill="url(#orangeBar)"/>
  <text x="368" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0a1628" text-anchor="middle">60% refinamento</text>

  <text x="60" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8899aa" text-anchor="start">
    1ª geração: 40% | verificação, correção e revalidação: 60%
  </text>
  <text x="60" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8899aa" text-anchor="start">
    McKinsey, 2026: o caro não é o rascunho, é a certeza.
  </text>

  <!-- CENTER: 7 camadas de custo -->
  <text x="540" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    As 7 camadas do custo total
  </text>

  <!-- stack of 7 layers, token layer highlighted -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <rect x="540" y="170" width="300" height="40" rx="6" fill="url(#cyanBar)" opacity="0.95"/>
    <text x="690" y="195" font-size="13" font-weight="700" fill="#0a1628" text-anchor="middle">1. Tokens e modelo</text>
    <rect x="540" y="216" width="300" height="40" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
    <text x="690" y="241" font-size="13" fill="#88d8f7" text-anchor="middle">2. Infraestrutura de IA</text>
    <rect x="540" y="262" width="300" height="40" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
    <text x="690" y="287" font-size="13" fill="#88d8f7" text-anchor="middle">3. Orquestração e plataforma</text>
    <rect x="540" y="308" width="300" height="40" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
    <text x="690" y="333" font-size="13" fill="#88d8f7" text-anchor="middle">4. Governança e compliance</text>
    <rect x="540" y="354" width="300" height="40" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
    <text x="690" y="379" font-size="13" fill="#88d8f7" text-anchor="middle">5. Redesenho organizacional</text>
    <rect x="540" y="400" width="300" height="40" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
    <text x="690" y="425" font-size="13" fill="#88d8f7" text-anchor="middle">6. Custo de falha</text>
    <rect x="540" y="446" width="300" height="40" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
    <text x="690" y="471" font-size="13" fill="#88d8f7" text-anchor="middle">7. Risco regulatório</text>
  </g>

  <text x="540" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8899aa" text-anchor="start">
    Business cases cobrem só as camadas 1 a 3 (EY, 2026)
  </text>

  <!-- RIGHT: os 3 donos do envelope -->
  <text x="900" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Quem define o envelope
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="900" y="170" width="240" height="56" rx="8" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="920" y="194" font-size="14" font-weight="700" fill="#ffffff">Finance</text>
    <text x="920" y="212" font-size="11" fill="#88d8f7">envelope e tolerância</text>

    <rect x="900" y="234" width="240" height="56" rx="8" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="920" y="258" font-size="14" font-weight="700" fill="#ffffff">Engenharia</text>
    <text x="920" y="276" font-size="11" fill="#88d8f7">cotas e limites por projeto</text>

    <rect x="900" y="298" width="240" height="56" rx="8" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="920" y="322" font-size="14" font-weight="700" fill="#ffffff">FinOps</text>
    <text x="920" y="340" font-size="11" fill="#88d8f7">traduz e traz evidência</text>
  </g>

  <!-- ownership stat -->
  <text x="900" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Ownership definido
  </text>
  <text x="900" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#f39c12" text-anchor="start">3,7x</text>
  <text x="900" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="start">
    mais chance de provar
  </text>
  <text x="900" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="start">
    valor ao CFO
  </text>
  <text x="900" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5a6b7c" text-anchor="start">
    Tokenomics Foundation, set/2026
  </text>

  <!-- Footer -->
  <line x1="60" y1="545" x2="1140" y2="545" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <text x="60" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">
    Quem não mede custo por task negocia preço. Quem mede, negocia renewal.
  </text>
  <text x="60" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00d4ff" text-anchor="start">
    BaXiJen: Antes de tudo, Brasileiro.
  </text>
</svg>