<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="internal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="external" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="bar94" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="bar51" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
    <linearGradient id="bar67" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="bar53" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#556677"/>
      <stop offset="100%" stop-color="#445566"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">
    O Comprador de IA em 2026
  </text>
  <text x="60" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#00d4ff" text-anchor="start">
    22 pessoas decidem antes de você entrar na sala
  </text>

  <!-- LEFT SIDE: The 22-person committee -->
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#8899aa" text-anchor="start">
    QUEM DECIDE A COMPRA DE IA
  </text>

  <!-- Central number -->
  <circle cx="240" cy="330" r="118" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.25"/>
  <circle cx="240" cy="330" r="98" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.15"/>
  <text x="240" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle">
    22
  </text>
  <text x="240" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#00d4ff" text-anchor="middle">
    pessoas no deal
  </text>

  <!-- Internal stakeholders badge (left) -->
  <circle cx="92" cy="480" r="34" fill="url(#internal)" opacity="0.9"/>
  <text x="92" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0a1628" text-anchor="middle">13</text>
  <text x="92" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0a1628" text-anchor="middle">INTERNOS</text>

  <!-- External influencers badge (right) -->
  <circle cx="388" cy="480" r="34" fill="url(#external)" opacity="0.9"/>
  <text x="388" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0a1628" text-anchor="middle">9</text>
  <text x="388" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0a1628" text-anchor="middle">EXTERNOS</text>

  <!-- Connector lines -->
  <line x1="118" y1="455" x2="180" y2="385" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="362" y1="455" x2="300" y2="385" stroke="#f39c12" stroke-width="1.5" opacity="0.5"/>

  <!-- Labels under badges -->
  <text x="92" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="middle">
    stakeholders
  </text>
  <text x="92" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="middle">
    internos
  </text>
  <text x="388" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="middle">
    influenciadores
  </text>
  <text x="388" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa" text-anchor="middle">
    externos
  </text>

  <!-- RIGHT SIDE: Journey stats bars -->
  <text x="560" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#8899aa" text-anchor="start">
    A JORNADA DE COMPRA EM 2026
  </text>

  <!-- Bar 1: 94% -->
  <text x="560" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="start">
    Usam IA na jornada de compra
  </text>
  <rect x="560" y="210" width="410" height="18" rx="4" fill="#1a2a44"/>
  <rect x="560" y="210" width="385" height="18" rx="4" fill="url(#bar94)"/>
  <text x="960" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#00d4ff" text-anchor="end">
    94%
  </text>

  <!-- Bar 2: 51% -->
  <text x="560" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="start">
    Começam a pesquisa em chatbot de IA
  </text>
  <rect x="560" y="272" width="410" height="18" rx="4" fill="#1a2a44"/>
  <rect x="560" y="272" width="209" height="18" rx="4" fill="url(#bar51)"/>
  <text x="960" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#27ae60" text-anchor="end">
    51%
  </text>

  <!-- Bar 3: 67% -->
  <text x="560" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="start">
    Preferem compra sem falar com vendedor
  </text>
  <rect x="560" y="334" width="410" height="18" rx="4" fill="#1a2a44"/>
  <rect x="560" y="334" width="275" height="18" rx="4" fill="url(#bar67)"/>
  <text x="960" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f39c12" text-anchor="end">
    67%
  </text>

  <!-- Bar 4: 53% -->
  <text x="560" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="start">
    Procurement como decisor desde o início
  </text>
  <rect x="560" y="396" width="410" height="18" rx="4" fill="#1a2a44"/>
  <rect x="560" y="396" width="217" height="18" rx="4" fill="url(#bar53)"/>
  <text x="960" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#8899aa" text-anchor="end">
    53%
  </text>

  <!-- Bottom insight -->
  <line x1="60" y1="580" x2="1140" y2="580" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <text x="600" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#00d4ff" text-anchor="middle">
    A decisão se forma antes do primeiro contato. Forrester, Gartner e G2, 2026.
  </text>
</svg>