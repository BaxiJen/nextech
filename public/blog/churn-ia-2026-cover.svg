<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee4444"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#51cf66"/>
      <stop offset="100%" stop-color="#37b24d"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff922b"/>
      <stop offset="100%" stop-color="#e8590c"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#fab005"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top label -->
  <rect x="60" y="40" width="180" height="32" rx="16" fill="url(#accent)" opacity="0.15"/>
  <text x="150" y="61" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="middle" letter-spacing="1.5">BAXIJEN BLOG</text>

  <!-- Title -->
  <text x="60" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Churn de IA em 2026</text>
  <text x="60" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#00d4ff">Por que seus clientes cancelam e como construir retenção</text>

  <!-- Main comparison: AI-native vs B2B SaaS -->
  <!-- AI-native side -->
  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="340" height="180" rx="12" fill="#1a2a4a" stroke="#ff6b6b" stroke-width="1.5" opacity="0.9"/>
    <text x="170" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ff6b6b" text-anchor="middle" letter-spacing="1">AI-NATIVE SaaS</text>

    <!-- NRR bar -->
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8899aa">NRR</text>
    <rect x="20" y="68" width="300" height="24" rx="4" fill="#223355"/>
    <rect x="20" y="68" width="144" height="24" rx="4" fill="url(#redGrad)"/>
    <text x="172" y="85" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ff6b6b">48%</text>

    <!-- GRR bar -->
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#8899aa">GRR</text>
    <rect x="20" y="123" width="300" height="24" rx="4" fill="#223355"/>
    <rect x="20" y="123" width="120" height="24" rx="4" fill="url(#redGrad)" opacity="0.8"/>
    <text x="148" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ff6b6b">40%</text>

    <text x="170" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#66778a" text-anchor="middle">3.500 empresas analisadas</text>
  </g>

  <!-- VS arrow -->
  <g transform="translate(420, 280)">
    <text x="30" y="0" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#00d4ff" text-anchor="middle">34pts</text>
    <text x="30" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#4499bb" text-anchor="middle">GAP</text>
    <line x1="-10" y1="40" x2="70" y2="40" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="65,36 75,40 65,44" fill="#00d4ff"/>
  </g>

  <!-- B2B SaaS side -->
  <g transform="translate(520, 210)">
    <rect x="0" y="0" width="340" height="180" rx="12" fill="#1a2a4a" stroke="#51cf66" stroke-width="1.5" opacity="0.9"/>
    <text x="170" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#51cf66" text-anchor="middle" letter-spacing="1">B2B SaaS TRADICIONAL</text>

    <!-- NRR bar -->
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8899aa">NRR</text>
    <rect x="20" y="68" width="300" height="24" rx="4" fill="#223355"/>
    <rect x="20" y="68" width="246" height="24" rx="4" fill="url(#greenGrad)"/>
    <text x="274" y="85" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#51cf66">82%</text>

    <!-- GRR bar -->
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#8899aa">GRR</text>
    <rect x="20" y="123" width="300" height="24" rx="4" fill="#223355"/>
    <rect x="20" y="123" width="189" height="24" rx="4" fill="url(#greenGrad)" opacity="0.8"/>
    <text x="217" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#51cf66">63%</text>

    <text x="170" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#66778a" text-anchor="middle">Fonte: ChartMogul 2025</text>
  </g>

  <!-- Price tier breakdown -->
  <text x="60" y="430" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" letter-spacing="0.5">RETENÇÃO POR FAIXA DE PREÇO (AI-NATIVE)</text>

  <!-- Tier 1: <$50/mo -->
  <g transform="translate(60, 450)">
    <rect x="0" y="0" width="340" height="60" rx="8" fill="#1a2a4a" stroke="#ff6b6b" stroke-width="1" opacity="0.7"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">&lt; $50/mês</text>
    <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#66778a">GRR 23% · NRR 32%</text>
    <rect x="240" y="12" width="80" height="36" rx="4" fill="url(#redGrad)" opacity="0.25"/>
    <text x="280" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ff6b6b" text-anchor="middle">32%</text>
  </g>

  <!-- Tier 2: $50-249/mo -->
  <g transform="translate(420, 450)">
    <rect x="0" y="0" width="340" height="60" rx="8" fill="#1a2a4a" stroke="#ff922b" stroke-width="1" opacity="0.7"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">$50 a $249/mês</text>
    <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#66778a">GRR 45% · NRR 61%</text>
    <rect x="240" y="12" width="80" height="36" rx="4" fill="url(#orangeGrad)" opacity="0.25"/>
    <text x="280" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ff922b" text-anchor="middle">61%</text>
  </g>

  <!-- Tier 3: >$250/mo -->
  <g transform="translate(780, 450)">
    <rect x="0" y="0" width="360" height="60" rx="8" fill="#1a2a4a" stroke="#51cf66" stroke-width="1" opacity="0.7"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">&gt; $250/mês</text>
    <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#66778a">GRR 70% · NRR 85%</text>
    <rect x="260" y="12" width="80" height="36" rx="4" fill="url(#greenGrad)" opacity="0.25"/>
    <text x="300" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#51cf66" text-anchor="middle">85%</text>
  </g>

  <!-- Bottom annotation -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="1080" height="50" rx="8" fill="#00d4ff" opacity="0.06"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#00d4ff">Gartner: 40%+ dos projetos de IA agentica serão cancelados até 2027</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#4499bb">ChartMogul SaaS Retention Report 2025 · SaaStr 2026 · Gartner 2025</text>
  </g>

  <!-- BaXiJen logo area -->
  <text x="1140" y="610" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#00d4ff" text-anchor="end" opacity="0.6">BaXiJen · Antes de tudo, Brasileiro.</text>
</svg>