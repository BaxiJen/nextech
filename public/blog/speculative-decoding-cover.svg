<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="draftBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
    <linearGradient id="targetBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="speedupBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#556677"/>
      <stop offset="100%" stop-color="#445566"/>
    </linearGradient>
    <linearGradient id="speedupBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="speedupBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
    <linearGradient id="speedupBar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">
    Speculative Decoding em Produção
  </text>
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#00d4ff" text-anchor="start">
    2-3x mais rápido. Qualidade idêntica. Sem trocar de modelo.
  </text>

  <!-- LEFT SIDE: Pipeline diagram -->
  <text x="60" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Pipeline de Speculative Decoding
  </text>

  <!-- Draft model box -->
  <rect x="60" y="175" width="200" height="80" rx="10" fill="url(#draftBar)" opacity="0.9"/>
  <text x="160" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Draft Model</text>
  <text x="160" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">1B-7B parâmetros</text>
  <text x="160" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d4f4e0" text-anchor="middle">Propõe 5-8 tokens</text>

  <!-- Arrow from draft to target -->
  <path d="M 270 215 L 330 215" stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#arrowEnd)"/>
  <text x="300" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle">K tokens</text>

  <!-- Target model box -->
  <rect x="340" y="175" width="240" height="80" rx="10" fill="url(#targetBar)" opacity="0.9"/>
  <text x="460" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Target Model</text>
  <text x="460" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">70B parâmetros</text>
  <text x="460" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d4f0ff" text-anchor="middle">Verifica K em 1 passada</text>

  <!-- Arrow from target to results -->
  <path d="M 590 215 L 650 215" stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#arrowEnd)"/>

  <!-- Results: accepted/rejected tokens -->
  <text x="660" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8899aa" text-anchor="start">Resultado</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14">
    <!-- Token 1 accepted -->
    <rect x="660" y="205" width="50" height="28" rx="4" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
    <text x="685" y="224" fill="#27ae60" text-anchor="middle" font-weight="600">t₁ ✓</text>
    <!-- Token 2 accepted -->
    <rect x="715" y="205" width="50" height="28" rx="4" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
    <text x="740" y="224" fill="#27ae60" text-anchor="middle" font-weight="600">t₂ ✓</text>
    <!-- Token 3 accepted -->
    <rect x="770" y="205" width="50" height="28" rx="4" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
    <text x="795" y="224" fill="#27ae60" text-anchor="middle" font-weight="600">t₃ ✓</text>
    <!-- Token 4 accepted -->
    <rect x="825" y="205" width="50" height="28" rx="4" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
    <text x="850" y="224" fill="#27ae60" text-anchor="middle" font-weight="600">t₄ ✓</text>
    <!-- Token 5 rejected -->
    <rect x="880" y="205" width="50" height="28" rx="4" fill="#e74c3c" opacity="0.2" stroke="#e74c3c" stroke-width="1"/>
    <text x="905" y="224" fill="#e74c3c" text-anchor="middle" font-weight="600">t₅ ✗</text>
  </g>
  <text x="795" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#556677" text-anchor="middle">4 aceitos / 5 propostos = 80% aceitação</text>

  <!-- Time comparison bar -->
  <text x="60" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#8899aa" text-anchor="start">
    Tempo para gerar 4 tokens
  </text>
  <!-- Standard decoding: 4 forward passes -->
  <rect x="60" y="315" width="500" height="32" rx="6" fill="url(#speedupBar1)" opacity="0.5"/>
  <text x="80" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Standard: 4 passadas</text>
  <text x="540" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">4x tempo</text>

  <!-- Speculative: 1 forward pass -->
  <rect x="60" y="355" width="125" height="32" rx="6" fill="url(#speedupBar3)" opacity="0.8"/>
  <text x="80" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Spec: 1 passada</text>
  <text x="180" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#27ae60" text-anchor="end">1x tempo</text>

  <!-- RIGHT SIDE: Speedup comparison table -->
  <text x="680" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Speedup por método
  </text>

  <!-- Table background -->
  <rect x="680" y="175" width="460" height="290" rx="12" fill="#0d1f3a" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>

  <!-- Table header -->
  <text x="700" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Método</text>
  <text x="920" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Speedup</text>
  <text x="1030" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Aceitação</text>

  <!-- Row 1: Vanilla -->
  <line x1="690" y1="220" x2="1130" y2="220" stroke="#1a3050" stroke-width="1"/>
  <rect x="920" y="230" width="60" height="10" rx="3" fill="url(#speedupBar1)" opacity="0.6"/>
  <text x="700" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">Standard (baseline)</text>
  <text x="985" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#556677">1.00x</text>
  <text x="1060" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#556677">-</text>

  <!-- Row 2: Draft model -->
  <line x1="690" y1="255" x2="1130" y2="255" stroke="#1a3050" stroke-width="1"/>
  <rect x="920" y="265" width="117" height="10" rx="3" fill="url(#speedupBar2)" opacity="0.8"/>
  <text x="700" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">Draft model (1B)</text>
  <text x="985" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f39c12">1.95x</text>
  <text x="1060" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e0e6ed">62%</text>

  <!-- Row 3: Medusa-2 -->
  <line x1="690" y1="290" x2="1130" y2="290" stroke="#1a3050" stroke-width="1"/>
  <rect x="920" y="300" width="133" height="10" rx="3" fill="url(#speedupBar2)" opacity="0.8"/>
  <text x="700" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">Medusa-2</text>
  <text x="985" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f39c12">2.21x</text>
  <text x="1060" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e0e6ed">68%</text>

  <!-- Row 4: EAGLE-1 -->
  <line x1="690" y1="325" x2="1130" y2="325" stroke="#1a3050" stroke-width="1"/>
  <rect x="920" y="335" width="151" height="10" rx="3" fill="url(#speedupBar3)" opacity="0.8"/>
  <text x="700" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">EAGLE-1</text>
  <text x="985" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#27ae60">2.52x</text>
  <text x="1060" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e0e6ed">73%</text>

  <!-- Row 5: EAGLE-3 -->
  <line x1="690" y1="360" x2="1130" y2="360" stroke="#1a3050" stroke-width="1"/>
  <rect x="920" y="370" width="173" height="10" rx="3" fill="url(#speedupBar4)" opacity="0.9"/>
  <text x="700" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">EAGLE-3</text>
  <text x="985" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">2.89x</text>
  <text x="1060" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e0e6ed">81%</text>

  <!-- Row 6: FP8 + EAGLE -->
  <line x1="690" y1="395" x2="1130" y2="395" stroke="#1a3050" stroke-width="1"/>
  <rect x="920" y="405" width="216" height="10" rx="3" fill="url(#speedupBar4)" opacity="0.9"/>
  <text x="700" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">FP8 + Spec (H200)</text>
  <text x="985" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">3.60x</text>
  <text x="1060" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e0e6ed">NVIDIA</text>

  <!-- Note under table -->
  <text x="680" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#556677">
    Benchmarks independentes: youngju.dev, Introl, NVIDIA, Red Hat (2025-2026)
  </text>

  <!-- BaXiJen branding -->
  <rect x="60" y="560" width="180" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="60" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">BaXiJen</text>
  <text x="130" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#556677">| Por Leonardo Camilo, CEO</text>
  <text x="60" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#556677">Antes de tudo, Brasileiro.</text>

  <!-- Decorative dots -->
  <circle cx="1140" cy="590" r="4" fill="#00d4ff" opacity="0.3"/>
  <circle cx="1155" cy="590" r="4" fill="#00d4ff" opacity="0.2"/>
  <circle cx="1170" cy="590" r="4" fill="#00d4ff" opacity="0.1"/>
</svg>