<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="skillBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="adoptBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="moat1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="moat2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <linearGradient id="moat3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00d4ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">
    Skills de Agentes IA: o Novo Moat
  </text>
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#00d4ff" text-anchor="start">
    Quando todo agente lê o mesmo arquivo, o diferencial migra.
  </text>

  <!-- LEFT: Anatomia da skill -->
  <text x="60" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    A anatomia de uma skill
  </text>

  <!-- Folder box -->
  <rect x="60" y="170" width="280" height="230" rx="10" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <path d="M 60 190 L 130 190 L 145 205 L 340 205" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="200" y="230" font-family="monospace" font-size="16" font-weight="700" fill="#00d4ff" text-anchor="middle">minha-skill/</text>

  <!-- SKILL.md -->
  <rect x="85" y="245" width="230" height="54" rx="6" fill="url(#skillBox)" opacity="0.9"/>
  <text x="200" y="268" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">SKILL.md</text>
  <text x="200" y="288" font-family="monospace" font-size="12" fill="#d4f0ff" text-anchor="middle">name + description (YAML)</text>

  <!-- Subfolders -->
  <rect x="85" y="310" width="105" height="36" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
  <text x="137" y="333" font-family="monospace" font-size="12" fill="#88d8f7" text-anchor="middle">scripts/</text>
  <rect x="200" y="310" width="105" height="36" rx="6" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
  <text x="252" y="333" font-family="monospace" font-size="12" fill="#88d8f7" text-anchor="middle">references/</text>

  <!-- Progressive disclosure levels -->
  <text x="60" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8899aa">Progressive disclosure:</text>
  <text x="60" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00d4ff">N1: metadata ~100 tokens</text>
  <text x="60" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00d4ff">N2: corpo &lt; 5k tokens, só quando aciona</text>
  <text x="60" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00d4ff">N3: scripts não entram no contexto</text>

  <!-- CENTER: Adoption -->
  <text x="440" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Adoção do padrão
  </text>

  <!-- 40+ big number -->
  <text x="440" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="url(#adoptBar)" text-anchor="start">40+</text>
  <text x="440" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#ffffff">ferramentas leem o formato SKILL.md</text>

  <!-- Growth arrow -->
  <path d="M 440 400 C 500 340, 560 310, 640 290" stroke="#00d4ff" stroke-width="4" fill="none" marker-end="url(#arrowEnd)"/>
  <text x="450" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8899aa">out/2025: 1 (Anthropic)</text>
  <text x="540" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#00d4ff">meados/2026: 40+</text>

  <!-- Vendor logos as text chips -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d4f0ff">
    <rect x="440" y="460" width="70" height="26" rx="13" fill="#16324f"/>
    <text x="475" y="477" text-anchor="middle">Codex</text>
    <rect x="520" y="460" width="90" height="26" rx="13" fill="#16324f"/>
    <text x="565" y="477" text-anchor="middle">Gemini CLI</text>
    <rect x="440" y="494" width="90" height="26" rx="13" fill="#16324f"/>
    <text x="485" y="511" text-anchor="middle">Copilot</text>
    <rect x="540" y="494" width="70" height="26" rx="13" fill="#16324f"/>
    <text x="575" y="511" text-anchor="middle">Cursor</text>
  </g>

  <!-- RIGHT: Moat layers -->
  <text x="760" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Para onde o moat migrou
  </text>

  <!-- Layer 1 -->
  <rect x="760" y="175" width="380" height="86" rx="10" fill="url(#moat1)" opacity="0.92"/>
  <text x="950" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1. Conhecimento de domínio</text>
  <text x="950" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#fff5e0" text-anchor="middle">o procedimento que não está em tutorial nenhum</text>

  <!-- Layer 2 -->
  <rect x="760" y="271" width="380" height="86" rx="10" fill="url(#moat2)" opacity="0.92"/>
  <text x="950" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2. Contexto institucional</text>
  <text x="950" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#fff5e0" text-anchor="middle">hierarquia, vocabulário e sistemas do cliente</text>

  <!-- Layer 3 -->
  <rect x="760" y="367" width="380" height="86" rx="10" fill="url(#moat3)" opacity="0.92"/>
  <text x="950" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3. Dados de uso</text>
  <text x="950" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffe8cc" text-anchor="middle">execuções, falhas e revisões: o flywheel</text>

  <!-- Commodity note -->
  <rect x="760" y="463" width="380" height="57" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1"/>
  <text x="950" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#88d8f7" text-anchor="middle">O formato virou commodity de ecossistema:</text>
  <text x="950" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#88d8f7" text-anchor="middle">Agent Plugins 1.0.0 (Vercel, AWS, Microsoft, OpenAI, GitHub)</text>

  <!-- Footer -->
  <rect x="0" y="560" width="1200" height="70" fill="#081120" opacity="0.85"/>
  <text x="600" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#00d4ff" text-anchor="middle">
    O formato virou commodity. O conhecimento, não.
  </text>
  <text x="600" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8899aa" text-anchor="middle">
    BaXiJen · Antes de tudo, Brasileiro.
  </text>
</svg>