<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="yellowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Title -->
  <text x="60" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">
    Custo de Inferência no Brasil: On-Prem vs Cloud
  </text>
  <text x="60" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#00d4ff" text-anchor="start">
    O benchmark em reais que a planilha em dólar não conta.
  </text>

  <!-- LEFT: queda do preço do token -->
  <text x="60" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#8899aa" text-anchor="start">
    O preço do token despencou (quem paga em dólar)
  </text>

  <!-- staircase: 60 -> 0.10 US$/M tokens -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cfe8ff">
    <!-- steps descending left to right -->
    <rect x="60"  y="410" width="66" height="120" rx="6" fill="#0f3a5f" stroke="#00d4ff" stroke-width="1.2"/>
    <text x="93" y="402" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">US$ 60</text>
    <text x="93" y="544" text-anchor="middle" fill="#8899aa" font-size="11">GPT-3 · 2020</text>

    <rect x="138" y="448" width="66" height="82"  rx="6" fill="#0f3a5f" stroke="#00d4ff" stroke-width="1.2"/>
    <text x="171" y="440" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">US$ 5</text>
    <text x="171" y="544" text-anchor="middle" fill="#8899aa" font-size="11">GPT-4 · 2023</text>

    <rect x="216" y="476" width="66" height="54"  rx="6" fill="#0f3a5f" stroke="#00d4ff" stroke-width="1.2"/>
    <text x="249" y="468" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">US$ 0,75</text>
    <text x="249" y="544" text-anchor="middle" fill="#8899aa" font-size="11">econom. 2024</text>

    <rect x="294" y="498" width="66" height="32"  rx="6" fill="#0f3a5f" stroke="#00d4ff" stroke-width="1.2"/>
    <text x="327" y="490" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">US$ 0,10</text>
    <text x="327" y="544" text-anchor="middle" fill="#8899aa" font-size="11">GPT-6 Luna · 2026</text>
  </g>
  <text x="60" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa">
    −47% por trimestre no preço de um nível de desempenho (Epoch AI, 2026)
  </text>

  <!-- CENTER: duas rotas comparadas -->
  <text x="428" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#8899aa" text-anchor="start">
    As três rotas no Brasil
  </text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Card 1: API -->
    <rect x="428" y="158" width="344" height="74" rx="10" fill="#16324f" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="446" y="184" font-size="15" font-weight="700" fill="#00d4ff">API em dólar</text>
    <text x="446" y="206" font-size="12" fill="#cfe8ff">token barato, fronteira com prêmio de 31,5x;</text>
    <text x="446" y="222" font-size="12" fill="#cfe8ff">câmbio + IOF/IRRF por cima (R$ 5,03/US$)</text>

    <!-- Card 2: cloud GPU -->
    <rect x="428" y="244" width="344" height="74" rx="10" fill="#16324f" stroke="#f39c12" stroke-width="1.5"/>
    <text x="446" y="270" font-size="15" font-weight="700" fill="#f39c12">Cloud GPU</text>
    <text x="446" y="292" font-size="12" fill="#cfe8ff">EUA on-demand: US$ 6,88-12,29/h · neoclouds: US$ 2,40-3,99</text>
    <text x="446" y="308" font-size="12" fill="#cfe8ff">Brasil: US$ 3,50-7,00/h, sem B200 nem H200 in-região</text>

    <!-- Card 3: on-prem -->
    <rect x="428" y="330" width="344" height="88" rx="10" fill="#16324f" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="446" y="356" font-size="15" font-weight="700" fill="#2ecc71">Servidor local com ex-tarifário</text>
    <text x="446" y="378" font-size="12" fill="#cfe8ff">Gecex 767/25: II 0% para GPU sem saída de vídeo;</text>
    <text x="446" y="394" font-size="12" fill="#cfe8ff">energia Grupo A ~R$ 0,50/kWh (vs R$ 0,99 residencial);</text>
    <text x="446" y="410" font-size="12" fill="#cfe8ff">llm-d 1.0: GLM-5.2 744B a ~US$ 0,11/M tokens (IBM)</text>
  </g>

  <!-- CENTER-BOTTOM: TCO do nó -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="428" y="448" font-size="15" font-weight="600" fill="#8899aa">TCO do nó 8x H100 em fábrica</text>
    <rect x="428" y="462" width="344" height="84" rx="10" fill="#0f2440" stroke="#2ecc71" stroke-width="1"/>
    <text x="446" y="486" font-size="13" fill="#cfe8ff">US$ 250k capex · 5 anos · 10 kW · tarifa A</text>
    <text x="446" y="508" font-size="13" fill="#cfe8ff">US$ 130.708/ano = <tspan font-weight="700" fill="#2ecc71">US$ 1,87 por GPU-hora</tspan> de calendário</text>
    <text x="446" y="530" font-size="13" fill="#cfe8ff">Engenharia 40k · energia 8,7k · capital 20k · colo 12k</text>
  </g>

  <!-- RIGHT: régua de ocupação -->
  <text x="812" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#8899aa" text-anchor="start">
    A régua: custo por GPU-hora usada
  </text>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <!-- faixa vermelha -->
    <rect x="812" y="158" width="328" height="118" rx="10" fill="#2b1520" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="830" y="184" font-size="15" font-weight="700" fill="#e74c3c">Abaixo de 40% de ocupação</text>
    <text x="830" y="208" fill="#cfe8ff">US$ 4,66/h usada: depreciação domina,</text>
    <text x="830" y="226" fill="#cfe8ff">capex parado em rack.</text>
    <text x="830" y="254" font-weight="700" fill="#e74c3c">Não compre: alugue ou use API</text>

    <!-- faixa amarela -->
    <rect x="812" y="288" width="328" height="118" rx="10" fill="#2b2515" stroke="#f1c40f" stroke-width="1.5"/>
    <text x="830" y="314" font-size="15" font-weight="700" fill="#f1c40f">Entre 40% e 70%</text>
    <text x="830" y="338" fill="#cfe8ff">US$ 2,66 a 4,66/h usada: decide o workload</text>
    <text x="830" y="356" fill="#cfe8ff">e o requisito sem preço de hora:</text>
    <text x="830" y="374" fill="#cfe8ff">LGPD, latência, auditabilidade.</text>

    <!-- faixa verde -->
    <rect x="812" y="418" width="328" height="128" rx="10" fill="#152b20" stroke="#2ecc71" stroke-width="1.5"/>
    <text x="830" y="444" font-size="15" font-weight="700" fill="#2ecc71">Acima de 70% de ocupação</text>
    <text x="830" y="468" fill="#cfe8ff">US$ 2,66/h ou menos: custo fixo se dilui,</text>
    <text x="830" y="486" fill="#cfe8ff">cache de prefixo bate 98% (llm-d),</text>
    <text x="830" y="504" fill="#cfe8ff">token produzido em centavos, em reais.</text>
    <text x="830" y="532" font-weight="700" fill="#2ecc71">A rota local vence por 2 a 4 vezes</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="600" width="1200" height="4" fill="url(#cyanBar)"/>
  <text x="60" y="586" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-style="italic" fill="#8899aa">
    Quem mede custo em dólar sem olhar o real assina o contrato mais caro.
  </text>
</svg>