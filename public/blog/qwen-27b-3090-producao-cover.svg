<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="okBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
    <linearGradient id="failBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="fixBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid sutil -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- kicker -->
  <text x="80" y="72" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#00d4ff" letter-spacing="3">TESTE DE PRODUÇÃO · IA LOCAL</text>

  <!-- título -->
  <text x="80" y="130" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">Qwen3.8-27B numa RTX 3090:</text>
  <text x="80" y="182" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#9fb3c8">o agente de análise financeira e o gargalo que não era a GPU</text>

  <!-- número hero: custo -->
  <g>
    <rect x="80" y="230" width="500" height="330" rx="14" fill="url(#card)" stroke="#00d4ff" stroke-opacity="0.35"/>
    <text x="110" y="290" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9fb3c8">CUSTO DE INFERÊNCIA</text>
    <text x="110" y="375" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="bold" fill="#00d4ff">R$ 2</text>
    <text x="330" y="375" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#9fb3c8">por milhão</text>
    <text x="330" y="407" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#9fb3c8">de tokens</text>
    <text x="110" y="450" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8">40 tokens/s · 2 conversas simultâneas</text>
    <text x="110" y="482" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8">290 W gerando · R$ 0,29/hora de energia</text>
    <text x="110" y="526" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#27ae60">✓ DCF validado no Focus · Fleuriet · pricing de IA</text>
    <text x="110" y="556" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#27ae60">✓ Selic e CDI corretos: consulta BACEN + web + calc</text>
  </g>

  <!-- número hero: falha e fix -->
  <g>
    <rect x="620" y="230" width="500" height="330" rx="14" fill="url(#card)" stroke="#e74c3c" stroke-opacity="0.35"/>
    <text x="650" y="290" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9fb3c8">O GARGALO REAL</text>
    <text x="650" y="375" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="bold" fill="#e74c3c">13%</text>
    <text x="850" y="355" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#9fb3c8">das respostas</text>
    <text x="850" y="387" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#9fb3c8">cortadas no meio</text>
    <text x="650" y="450" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8">Causa: contas de cabeça estourando o teto de</text>
    <text x="650" y="480" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8">raciocínio. Overthinking degrada a tool call.</text>
    <rect x="650" y="508" width="440" height="44" rx="8" fill="url(#fixBar)" opacity="0.25"/>
    <text x="666" y="537" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#00d4ff">Fix: teto 8.192 + calc fora do modelo → 0 falhas</text>
  </g>

  <!-- rodapé -->
  <text x="80" y="606" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#5d7290">BaXiJen · Leonardo Camilo · baxijen.com.br/blog</text>
</svg>
