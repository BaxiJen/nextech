<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">
    Quantização de LLMs em Produção
  </text>
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#00d4ff" text-anchor="start">
    Modelos 4x menores sem perder qualidade
  </text>

  <!-- Left side: VRAM bars -->
  <text x="60" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    VRAM para modelo 70B (GB)
  </text>

  <!-- Bar FP16 -->
  <rect x="60" y="180" width="500" height="55" rx="8" fill="url(#bar1)" opacity="0.9"/>
  <text x="80" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">FP16</text>
  <text x="540" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="end">140 GB</text>
  <text x="570" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8899aa" text-anchor="start">2x A100 80GB</text>

  <!-- Bar INT8 -->
  <rect x="60" y="250" width="250" height="55" rx="8" fill="url(#bar2)" opacity="0.9"/>
  <text x="80" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">INT8</text>
  <text x="290" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="end">70 GB</text>
  <text x="320" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8899aa" text-anchor="start">1x A100 80GB</text>

  <!-- Bar INT4 -->
  <rect x="60" y="320" width="125" height="55" rx="8" fill="url(#bar3)" opacity="0.9"/>
  <text x="80" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">INT4</text>
  <text x="165" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="end">35 GB</text>
  <text x="195" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8899aa" text-anchor="start">1x RTX 4090 24GB</text>

  <!-- Arrow showing reduction -->
  <path d="M 580 200 L 580 260 L 580 330 L 580 350" stroke="#00d4ff" stroke-width="2" fill="none" stroke-dasharray="5,3" opacity="0.4"/>
  <text x="600" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="start" transform="rotate(-90, 600, 270)">4x redução</text>

  <!-- Right side: Quality table -->
  <text x="680" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#8899aa" text-anchor="start">
    Retenção de qualidade
  </text>

  <!-- Table background -->
  <rect x="680" y="175" width="460" height="220" rx="12" fill="#0d1f3a" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>

  <!-- Table header -->
  <text x="700" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Formato</text>
  <text x="830" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Bits</text>
  <text x="900" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Qualidade</text>
  <text x="1040" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">Uso</text>

  <!-- Row 1: FP8 -->
  <line x1="690" y1="220" x2="1130" y2="220" stroke="#1a3050" stroke-width="1"/>
  <text x="700" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">FP8</text>
  <text x="830" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">8</text>
  <text x="900" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#27ae60">~99%</text>
  <text x="1040" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa">H100/B200</text>

  <!-- Row 2: INT8 -->
  <line x1="690" y1="260" x2="1130" y2="260" stroke="#1a3050" stroke-width="1"/>
  <text x="700" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">INT8</text>
  <text x="830" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">8</text>
  <text x="900" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#27ae60">97-98%</text>
  <text x="1040" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa">Produção</text>

  <!-- Row 3: AWQ INT4 -->
  <line x1="690" y1="300" x2="1130" y2="300" stroke="#1a3050" stroke-width="1"/>
  <text x="700" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">AWQ INT4</text>
  <text x="830" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">4</text>
  <text x="900" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f39c12">94-96%</text>
  <text x="1040" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa">VRAM limit</text>

  <!-- Row 4: GPTQ INT4 -->
  <line x1="690" y1="340" x2="1130" y2="340" stroke="#1a3050" stroke-width="1"/>
  <text x="700" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">GPTQ INT4</text>
  <text x="830" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">4</text>
  <text x="900" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f39c12">93-95%</text>
  <text x="1040" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa">Pré-quant</text>

  <!-- Row 5: GGUF Q4 -->
  <line x1="690" y1="380" x2="1130" y2="380" stroke="#1a3050" stroke-width="1"/>
  <text x="700" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">GGUF Q4_K_M</text>
  <text x="830" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e6ed">4</text>
  <text x="900" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f39c12">~95%</text>
  <text x="1040" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8899aa">CPU/GPU</text>

  <!-- BaXiJen branding -->
  <rect x="60" y="560" width="180" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="60" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00d4ff">BaXiJen</text>
  <text x="130" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#556677">| Por Marcus Ramalho, CTO</text>
  <text x="60" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#556677">Antes de tudo, Brasileiro.</text>

  <!-- Decorative dots -->
  <circle cx="1140" cy="590" r="4" fill="#00d4ff" opacity="0.3"/>
  <circle cx="1155" cy="590" r="4" fill="#00d4ff" opacity="0.2"/>
  <circle cx="1170" cy="590" r="4" fill="#00d4ff" opacity="0.1"/>
</svg>